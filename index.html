    <!-- JS code for animated text -->
    <script>
        const phrases = ["web developer", "AI enthusiast", "ML enthusiast", "Computer engineering student"];
        let currentPhraseIndex = 0;
        const animatedTextElement = document.querySelector('.animated-text');
        
        function updateText() {
            animatedTextElement.textContent = phrases[currentPhraseIndex];
            currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
        }
        
        // Initial text update
        updateText();
        
        // Update the text every 3 seconds to sync with the typing animation
        setInterval(updateText, 3000);

        // Toggle navigation menu
        const menuToggle = document.querySelector('.menu-toggle');
        const navList = document.querySelector('.nav-list');

        menuToggle.addEventListener('click', () => {
            // Toggle the 'active' class on the navigation list
            navList.classList.toggle('active');

            // Change the button's appearance based on the state
            if (navList.classList.contains('active')) {
                menuToggle.textContent = '✖'; // Change to an 'X' when active
                navList.style.display = 'flex'; // Show the menu
            } else {
                menuToggle.textContent = '☰'; // Change back to the hamburger icon
                navList.style.display = 'none'; // Hide the menu
            }
        });
    </script>
